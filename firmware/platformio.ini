; Savx F4 WiFi datalogger firmware (ESP32-S3-N16R8). See README.md and research/d1-architecture.md §5.
;
; Toolchain verified 2026-10-21 against GitHub (gh api):
;   - pioarduino release 55.03.312-1 (published 2026-09-22, NOT a pre-release; ships platform-espressif32.zip)
;     = Arduino-ESP32 3.3.12 + ESP-IDF 5.5.5. Avoid 61.04.00-RC1 (pre-release, Arduino 4.0.0-RC1).
;   - board esp32-s3-devkitc1-n16r8 exists at that tag: memory_type qio_opi, psram_type opi,
;     flash 16MB, partitions default_16MB.csv (2 x 6.25 MB app + 3.4 MB "spiffs" used as LittleFS), -DBOARD_HAS_PSRAM.

[platformio]
default_envs = savx

[env:savx]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=0     ; Serial = UART0 via the "COM" USB-C port (CH343 bridge)
  -DINV_ALLOW_WRITES=0            ; read-only towards the inverter (setter code is not compiled at all)
  -DCORE_DEBUG_LEVEL=2
  -Iinclude
  -Isrc
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  tzapu/WiFiManager@2.0.17
  ayushsharma82/ElegantOTA@4.0.0  ; sync mode: ELEGANTOTA_USE_ASYNC_WEBSERVER is NOT defined
test_ignore = *
lib_ignore =
  ESPAsyncWebServer   ; pulled in by ElegantOTA 4.0.0's manifest, unused in sync mode (d1 K8)
  AsyncTCP

[env:native]
; Host unit tests (Unity): CRC vectors, whitelist, parsers, prober decision tree, aggregation, alerts,
; usage-threshold rules (r8 §4.13), month-to-date, uplink paths/bodies/back-fill/budget/HTTP parser (FW-2),
; grid meter: Tuya LAN protocol, data points, kWh day accounting (0.9.0).
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
  bblanchon/ArduinoJson@7.4.3     ; header-only and host-portable: RuleParse / UplinkJson are unit-tested
build_flags =
  -std=gnu++17
  -DUNIT_TEST
  -DUNITY_INCLUDE_DOUBLE
  -DNATIVE_BUILD
  -DINV_ALLOW_WRITES=0
  -Iinclude
  -Isrc
  -Itest
  -Wall
  ; test_meter checks the Tuya crypto with OpenSSL (Homebrew on macOS, libssl-dev on Linux)
  -I/opt/homebrew/opt/openssl@3/include
  -L/opt/homebrew/opt/openssl@3/lib
  -lcrypto
; Only host-portable sources (no Arduino.h) are compiled for the native tests.
build_src_filter =
  -<*>
  +<link/Whitelist.cpp>
  +<link/SerialLink.cpp>
  +<link/PinDiag.cpp>
  +<proto/>
  +<model/>
  +<agg/>
  +<store/MinuteRec.cpp>
  +<net/HttpParse.cpp>
  +<net/UplinkJson.cpp>
  +<net/Backfill.cpp>
  +<net/Budget.cpp>
  +<net/NotifyFormat.cpp>
  +<net/OtaPlan.cpp>
  +<meter/TuyaProto.cpp>
  +<meter/MeterLive.cpp>
  +<meter/MeterDay.cpp>
