version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    ignore:
      # Vite 7+ needs Node >= 20.19; the Mac runs 20.17 (web/README.md). Bump by hand.
      - dependency-name: vite
        update-types: ['version-update:semver-major']
